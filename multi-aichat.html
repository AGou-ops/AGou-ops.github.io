    <script>
      const EXT_ID = "daeejbkgpkoagacncliemiienmlnclmj";
      const TARGET_URL = `chrome-extension://${EXT_ID}/chatbrawl.html`;

      // ⏱️ 跳转延迟配置（单位：毫秒 ms）
      // 设置为 5000 即表示等待 5 秒后跳转；设为 0 则表示立即无缝跳转
      const REDIRECT_DELAY_MS = 10000;

      function doDirectRedirect() {
        if (window.chrome && chrome.runtime && chrome.runtime.sendMessage) {
          chrome.runtime.sendMessage(
            EXT_ID,
            { action: "redirectSelf" },
            (res) => {
              if (chrome.runtime.lastError || !res || !res.ok) {
                location.replace(TARGET_URL);
              }
            },
          );
        } else {
          location.replace(TARGET_URL);
        }
      }

      // 延迟控制逻辑：<= 0 立即跳转，> 0 延时触发
      if (REDIRECT_DELAY_MS <= 0) {
        doDirectRedirect();
      } else {
        setTimeout(doDirectRedirect, REDIRECT_DELAY_MS);
      }
