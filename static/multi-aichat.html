    <!-- PWA Manifest (数据内嵌，支持 Chrome 识别并安装为 PWA APP) -->
    <link
      rel="manifest"
      href="data:application/manifest+json;base64,eyJuYW1lIjogIk11bHRpIEFJIENoYXQgRXh0ZW5zaW9uIiwgInNob3J0X25hbWUiOiAiTXVsdGkgQUkgQ2hhdCBFeHRlbnNpb24iLCAic3RhcnRfdXJsIjogIi4vbXVsdGktYWljaGF0Lmh0bWwiLCAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwgImJhY2tncm91bmRfY29sb3IiOiAiIzBmMTcyYSIsICJ0aGVtZV9jb2xvciI6ICIjNjM2NmYxIiwgImljb25zIjogW3sic3JjIjogImh0dHBzOi8vYWdvdS1pbWFnZXMub3NzLWNuLXFpbmdkYW8uYWxpeXVuY3MuY29tL2ljb25zL211bHRpLWFpY2hhdC5wbmciLCAic2l6ZXMiOiAiMTkyeDE5MiA1MTJ4NTEyIiwgInR5cGUiOiAiaW1hZ2UvcG5nIiwgInB1cnBvc2UiOiAiYW55IG1hc2thYmxlIn1dfQ=="
    />

    <script>
      const EXT_ID = "daeejbkgpkoagacncliemiienmlnclmj";
      const TARGET_URL = `chrome-extension://${EXT_ID}/chatbrawl.html`;

      // ⏱️ 跳转延迟配置（单位：毫秒 ms）
      // 设置为 5000 即表示等待 5 秒后跳转；设为 0 则表示立即无缝跳转
      const REDIRECT_DELAY_MS = 10000;

      function doDirectRedirect() {
        if (window.chrome && chrome.runtime && chrome.runtime.sendMessage) {
          chrome.runtime.sendMessage(
            EXT_ID,
            { action: "redirectSelf" },
            (res) => {
              if (chrome.runtime.lastError || !res || !res.ok) {
                location.replace(TARGET_URL);
              }
            },
          );
        } else {
          location.replace(TARGET_URL);
        }
      }

      // 延迟控制逻辑：<= 0 立即跳转，> 0 延时触发
      if (REDIRECT_DELAY_MS <= 0) {
        doDirectRedirect();
      } else {
        setTimeout(doDirectRedirect, REDIRECT_DELAY_MS);
      }
    </script>
  </head>
  <body></body>
</html>
